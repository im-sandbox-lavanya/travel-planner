{% extends "base.html" %}

{% block title %}New Travel Plan{% endblock %}

{% block content %}
<h1>Create a New Travel Plan</h1>

{% if errors %}
<div class="alert alert-error">
    <ul>
    {% for err in errors %}
        <li>{{ err }}</li>
    {% endfor %}
    </ul>
</div>
{% endif %}

<form method="post" action="/plans" class="plan-form">
    <label for="user_name">User Name</label>
    <input type="text" id="user_name" name="user_name" required placeholder="e.g. Jane Doe">

    <label for="destination">Destination</label>
    <input type="text" id="destination" name="destination" required placeholder="e.g. Tokyo, Japan">

    <label for="start_date">Start Date</label>
    <input type="date" id="start_date" name="start_date" required>

    <label for="end_date">End Date</label>
    <input type="date" id="end_date" name="end_date" required>

    <label for="budget">Budget ($)</label>
    <input type="number" id="budget" name="budget" step="0.01" min="0" placeholder="Optional">

    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="4" placeholder="Anything you want to remember..."></textarea>

    <div class="form-actions">
        <button type="submit" class="btn">Save Plan</button>
        <a href="/" class="btn btn-outline">Cancel</a>
    </div>
</form>
{% endblock %}
